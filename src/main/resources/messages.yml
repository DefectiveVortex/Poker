# Messages Configuration File (English)
# This file contains all user-facing messages. Other languages live in messages_<code>.yml;
# pick one with `language:` in config.yml. Keys missing from a translation fall back to this text.
# Color codes: &0-&9, &a-&f for colors, &l (bold), &n (underline), &o (italic), &m (strikethrough), &r (reset)
# Placeholders are marked with %placeholder_name%

# Core messages
prefix: "&8[&2Poker&8] &r"
no-permission: "&cYou don't have permission to do that!"
player-only-command: "&cThis command can only be used by players!"
unknown-command: "&cUnknown subcommand. Use &e/poker help&c."
currency-format: "$%amount%"
economy-unavailable: "&cThe economy isn't available right now. Is Vault and an economy plugin installed?"
reload-done: "&aPoker configuration reloaded."
invalid-amount: "&cInvalid amount: '%value%'"

# Help (/poker help)
help-header: "&6Poker commands:"
help-lines:
  - "&e/poker join &7- Sit at the nearest table"
  - "&e/poker leave &7- Stand up and cash out"
  - "&e/poker fold|check|call &7- Act on your turn"
  - "&e/poker bet <n> &7/ &e/poker raise <n> &7- Bet or raise to a total of n"
  - "&e/poker allin &7- Move all your chips in"
  - "&e/poker topup <n> &7- Add chips between hands"
  - "&e/poker menu &7- Open the action menu"
  - "&e/poker stats [player] &7- Your poker statistics"
  - "&e/poker tables &7- List the tables"
help-admin-lines:
  - "&c/poker createtable [seats:<n>] [small-blind:<n>] [big-blind:<n>] [min-buy-in:<bb>] [max-buy-in:<bb>] [max-join-distance:<n>]"
  - "&c/poker settable <setting> <value> &7- Change the nearest table"
  - "&c/poker removetable [id] &7- Remove the nearest table, or one by ID"
  - "&c/poker cleanup [radius] &7- Remove leftover card displays nearby"
  - "&c/poker reload &7- Reload config and messages"
  - "&c/poker version &7- Plugin version and update status"

# Table management
table-created: "&aPoker table #%id% created! &7(%seats% seats, blinds &e%small_blind%/%big_blind%&7, buy-in &e%min_buy_in%&7-&e%max_buy_in%&7)"
table-overlaps: "&cA table can't go here: it would overlap another table or blocks."
createtable-invalid-arg: "&cInvalid argument: %error%"
table-removed: "&cPoker table #%id% removed. Seated players were cashed out."
no-table-nearby: "&cNo table found nearby!"
table-not-found-id: "&cThere's no table with ID %id%."
tables-header: "&6Poker tables (%count%):"
tables-entry: "&e#%id% &7%world% %x%, %y%, %z% &8| &f%players%/%seats% seated &8| &7blinds %small_blind%/%big_blind%"
tables-none: "&7There are no poker tables yet."
settable-usage: "&eUsage: /poker settable <setting> <value> &7(seats, small-blind, big-blind, min-buy-in, max-buy-in, max-join-distance)"
settable-updated: "&aSetting &e%setting% &aset to &e%value% &aon table #%id%."
settable-rebuilt: "&aTable #%id% rebuilt with &e%value% &aseats."
table-busy-seats: "&cThe seat count can only change while nobody is seated at the table."
cleanup-usage: "&cUsage: /poker cleanup [radius]"
cleanup-done: "&aRemoved %count% leftover card display(s) within %radius% blocks."

# Table setting errors (inserted into createtable-invalid-arg; buy-ins are in big blinds)
table-error-min-exceeds-max: "min-buy-in (%min%) cannot exceed max-buy-in (%max%)"
table-error-max-seats-range: "seats must be between 2 and %max%"
table-error-min-distance: "max-join-distance must be at least 1"
table-error-invalid-format: "Invalid argument '%arg%', expected key:value"
table-error-unknown-setting: "Unknown setting '%setting%'. Valid: seats, small-blind, big-blind, min-buy-in, max-buy-in, max-join-distance"
table-error-invalid-value: "Invalid value for '%setting%': %value%"

# Joining and leaving
already-at-table: "&cYou're already seated at a table. Use &e/poker leave &cfirst."
not-at-table: "&cYou're not seated at a poker table."
table-full: "&cThis table is full."
too-far-from-table: "&cYou're too far from the table."
resource-pack-prompt: "&7This table shows cards with the &ePlaying Cards &7resource pack."

# Buy-in and top-up
buy-in-prompt: "&7Choose your buy-in &8(&e%min%&8 - &e%max%&8)&7:"
buy-in-custom-prompt: "&7Type &e/poker join <amount> &7for another amount (&e%min%&7 - &e%max%&7)."
buy-in-out-of-range: "&cThe buy-in here is between &e%min% &cand &e%max%&c."
insufficient-funds: "&cYou need at least &e%amount% &cfor that. Your balance: &e%balance%"
topup-prompt: "&7Top up your stack &8(up to &e%max%&8)&7:"
topup-none-allowed: "&cYour stack is already at the table maximum."
topup-usage: "&eUsage: /poker topup <amount>"

# Your turn
not-your-turn: "&cIt's not your turn."
no-hand-in-progress: "&cNo hand is being played right now."
turn-prompt: "&6Your turn &7- to call: &e%to_call% &8| &7pot: &e%pot% &8| &7stack: &e%stack%"
bet-usage: "&eUsage: /poker bet <amount> &7(the total you put in this round)"
raise-usage: "&eUsage: /poker raise <amount> &7(raise to this total)"

