# First time a player sits down (interface.first-time-guide)
first-time-guide:
  - "&6Welcome to poker! &7Quick start:"
  - "&7You get &f2 cards&7; 5 shared cards come out in 3 rounds. Make the best 5-card hand."
  - "&7Blinds are &e%small_blind%/%big_blind%&7. On your turn click &cFold&7, &aCheck&7/&eCall &7or &6Raise &7in chat."
  - "&7Win the pot with the best hand, or by betting until everyone else folds. &e/poker help &7for more."

# Your turn (the cards line comes first; the "Your turn - to call" line must keep its shape for the test bots)
