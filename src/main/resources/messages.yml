raise-menu-title: "&2Raise to..."
buyin-menu-title: "&2Buy in"
topup-menu-title: "&2Top up"
menu-fold: "&cFold"
menu-check: "&aCheck"
menu-call: "&eCall %amount%"
menu-bet: "&6Bet..."
menu-raise: "&6Raise..."
menu-allin: "&4&lAll in &r&7(%amount%)"
menu-min-raise: "&eMin raise to %amount%"
menu-half-pot: "&e½ pot: to %amount%"
menu-pot: "&ePot: to %amount%"
menu-custom: "&bCustom amount"
menu-custom-lore: "&7Type &e/poker raise <amount> &7in chat"
menu-back: "&7Back"
menu-close: "&7Close"
menu-amount: "&e%amount%"
menu-stack-lore: "&7Your stack: &e%stack%"
menu-balance-lore: "&7Your balance: &e%balance%"

