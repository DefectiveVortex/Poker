help-header: "&6&lПокер &7- Техасский холдем"
help-intro:
  - "&7Садитесь за стол, делайте бай-ин и играйте за банк."
  - "&7В каждой раздаче у вас &f2 карты&7, на стол выкладываются 5 общих. Побеждает лучшая комбинация из 5 карт."
  - "&7В свой ход просто нажимайте кнопки в чате: &cФолд&7, &aЧек&7/&eКолл&7, &6Рейз&7."
  - "&7Уйти можно в любой момент: &e/poker leave&7, фишки вернутся."
help-commands-header: "&6Команды:"
help-lines:
  - "&e/poker join &7- Сесть за ближайший стол"
  - "&e/poker leave &7- Встать и забрать фишки"
  - "&e/poker fold|check|call &7- Сделать ход"
  - "&e/poker bet <n> &7/ &e/poker raise <n> &7- Ставка или рейз до суммы n"
  - "&e/poker allin &7- Поставить все фишки"
  - "&e/poker topup <n> &7- Докупить фишки между раздачами"
  - "&e/poker ready &7- играть следующую раздачу"
  - "&e/poker menu &7- Открыть меню действий"
  - "&e/poker stats [игрок] &7- Статистика покера"
  - "&e/poker tables &7- Список столов"
help-admin-lines:
  - "&c/poker createtable [seats:<n>] [small-blind:<n>] [big-blind:<n>] [min-buy-in:<bb>] [max-buy-in:<bb>] [max-join-distance:<n>]"
  - "&c/poker settable <параметр> <значение> &7- Изменить ближайший стол"
  - "&c/poker removetable [id] &7- Убрать ближайший стол или стол по ID"
  - "&c/poker cleanup [радиус] &7- Убрать оставшиеся карты поблизости"
  - "&c/poker reload &7- Перезагрузить настройки и сообщения"
  - "&c/poker version &7- Версия плагина"

