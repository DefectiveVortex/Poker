# Texts that earlier Poker versions shipped as defaults. Not a config file: don't edit it on a server.
# When config.yml or a messages file still holds one of these old texts, nobody customised it, so the
# plugin swaps in the current default (or drops it, for a key that no longer exists). A customised value is
# never touched. Before each release, add the previous release's changed or removed defaults here.
messages:
- key: help-admin-lines
  old:
  - - '&c/poker createtable [seats:<n>] [small-blind:<n>] [big-blind:<n>] [min-buy-in:<bb>] [max-buy-in:<bb>] [max-join-distance:<n>]'
    - '&c/poker settable <setting> <value> &7- Change the nearest table'
    - '&c/poker removetable [id] &7- Remove the nearest table, or one by ID'
    - '&c/poker cleanup [radius] &7- Remove leftover card displays nearby'
    - '&c/poker reload &7- Reload config and messages'
    - '&c/poker version &7- Plugin version and update status'
- key: turn-cards-preflop
  old:
  - '&7Your cards %cards% &8· &7You have: &e%hand%'
  removed: true
- key: turn-cards
  old:
