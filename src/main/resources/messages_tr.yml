help-header: "&6&lPoker &7- Texas Hold'em"
help-intro:
  - "&7Bir masaya otur, para ile giriş yap ve pot için oyna."
  - "&7Her elde &f2 kart &7alırsın; masaya 5 ortak kart açılır. En iyi 5 kartlık el kazanır."
  - "&7Sıran geldiğinde sohbetteki düğmelere tıkla: &cFold&7, &aCheck&7/&eCall&7, &6Artır&7."
  - "&7İstediğin zaman &e/poker leave &7ile kalk; fişlerin geri ödenir."
help-commands-header: "&6Komutlar:"
help-lines:
  - "&e/poker join &7- En yakın masaya otur"
  - "&e/poker leave &7- Kalk ve fişlerini paraya çevir"
  - "&e/poker fold|check|call &7- Sıran geldiğinde oyna"
  - "&e/poker bet <n> &7/ &e/poker raise <n> &7- Toplam n olacak şekilde bahis yap veya artır"
  - "&e/poker allin &7- Tüm fişlerini sür"
  - "&e/poker topup <n> &7- Eller arasında fiş ekle"
  - "&e/poker ready &7- sonraki eli oyna"
  - "&e/poker menu &7- Hamle menüsünü aç"
  - "&e/poker stats [oyuncu] &7- Poker istatistiklerin"
  - "&e/poker tables &7- Masaları listele"
help-admin-lines:
  - "&c/poker createtable [seats:<n>] [small-blind:<n>] [big-blind:<n>] [min-buy-in:<bb>] [max-buy-in:<bb>] [max-join-distance:<n>]"
  - "&c/poker settable <ayar> <değer> &7- En yakın masayı değiştir"
  - "&c/poker removetable [id] &7- En yakın masayı ya da ID'si verilen masayı kaldır"
  - "&c/poker cleanup [yarıçap] &7- Yakındaki artık kart görüntülerini temizle"
  - "&c/poker reload &7- Ayarları ve mesajları yeniden yükle"
  - "&c/poker version &7- Eklenti sürümü"

